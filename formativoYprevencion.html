            ];

            // Variables de estado
            var currentCategory = 'todos';
            var currentPage = 1;
            var itemsPerPage = 6; // Mostrar 6 elementos por página
            var filteredData = []; // Guardará los datos después de aplicar búsqueda/filtro

            // 2. Utilidad: Quitar acentos para que la búsqueda sea exacta
            function removeAccents(str) {
              return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            }

            // 3. Contadores para los botones
            function updateCounts() {
              $('#count-todos').text(jsonData.length);
              $('#count-infografias').text(jsonData.filter(item => removeAccents(item.Categoria.toLowerCase()) === 'diagnostico').length);
              $('#count-carteles').text(jsonData.filter(item => removeAccents(item.Categoria.toLowerCase()) === 'estrategias').length);
              $('#count-tripticos').text(jsonData.filter(item => removeAccents(item.Categoria.toLowerCase()) === 'actividades').length);
            }

            // 4. Renderizar las Tarjetas (Solo la página actual)
            function renderResults(data) {
              var container = $('#resultsContainer');
              container.empty();

              if (data.length === 0) {
                container.append('<div class="col-xs-12 text-center"><h4>No se encontraron recursos.</h4></div>');
                return;
              }

                var html = `
                        <div class="col-sm-6 col-md-4">
                            <div class="recurso-card">
                                <div class="recurso-img-box">
                                    
                                    <img src="${item.Imagen_preview}" alt="${item.Nombre}">

                                <button class="btn btn-ver btn-block btn-abrir-modal" 
                                        data-url="${item.Url}" 
                                        data-tipo="${item.Tipo_material}"
                                        data-titulo="${item.Nombre}">
                                   Ver &nbsp; <i class="glyphicon glyphicon-chevron-right" style="font-size: 10px;"></i>
                                </button>
                            </div>
                        </div>
                    `;
                container.append(html);
              });
            }

            // 5. Renderizar los botones de Paginación
            function renderPagination(totalItems) {
              var pagination = $('#paginationContainer');
              pagination.empty();

              var totalPages = Math.ceil(totalItems / itemsPerPage);

              if (totalPages <= 1) return; // Si solo hay 1 página, no mostramos botones

              // Botón Anterior
              var prevClass = (currentPage === 1) ? 'disabled' : '';
              pagination.append(`<li class="${prevClass}"><a href="#" data-page="prev">&laquo;</a></li>`);

              // Números de página
              for (var i = 1; i <= totalPages; i++) {
                var activeClass = (currentPage === i) ? 'active' : '';
                pagination.append(`<li class="${activeClass}"><a href="#" data-page="${i}">${i}</a></li>`);
              }

              // Botón Siguiente
              var nextClass = (currentPage === totalPages) ? 'disabled' : '';
              pagination.append(`<li class="${nextClass}"><a href="#" data-page="next">&raquo;</a></li>`);
            }

            // 6. Lógica Principal: Filtrar, Cortar (Paginación) y Renderizar
            function processData() {
              var searchTerm = removeAccents($('#searchInput').val().toLowerCase());

              // A. Aplicar Filtros y Búsqueda
              filteredData = jsonData.filter(function (item) {
                var itemCategoria = removeAccents(item.Categoria.toLowerCase());
                var matchesCategory = (currentCategory === 'todos') || (itemCategoria === currentCategory);

                var itemNombre = removeAccents(item.Nombre.toLowerCase());
                var matchesSearch = itemNombre.includes(searchTerm);

                return matchesCategory && matchesSearch;
              });

              // B. Calcular Paginación
              var totalPages = Math.ceil(filteredData.length / itemsPerPage);
              if (currentPage > totalPages) currentPage = totalPages || 1;

              var startIndex = (currentPage - 1) * itemsPerPage;
              var endIndex = startIndex + itemsPerPage;
              var paginatedData = filteredData.slice(startIndex, endIndex);

              // C. Dibujar en Pantalla
              renderResults(paginatedData);
              renderPagination(filteredData.length);
            }

            // Renderizar resultados
            function renderResults(data) {
              var container = $('#resultsContainer');
              container.empty();

              if (data.length === 0) {
                container.append('<div class="col-xs-12 text-center"><h4>No se encontraron recursos.</h4></div>');
                return;
              }

              $.each(data, function (index, item) {
                // CAMBIO: Ahora usamos un <button> en lugar de un <a> y le pasamos atributos "data-"
                var html = `
                        <div class="col-sm-6 col-md-4">
                            <div class="recurso-card">
                                <div class="recurso-img-box">
                                    
                                    <img src="${item.Imagen_preview}" alt="${item.Nombre}">
                                </div>
                                <h4 class="recurso-titulo">${item.Nombre}</h4>
                                <button class="btn btn-ver btn-block btn-abrir-modal" 
                                        data-url="${item.Url}" 
                                        data-tipo="${item.Tipo_material}"
                                        data-titulo="${item.Nombre}">
                                   Ver &nbsp; <i class="glyphicon glyphicon-chevron-right" style="font-size: 10px;"></i>
                                </button>
                            </div>
                        </div>
                    `;
                container.append(html);
              });
            }

            // Lógica de filtrado
            function filterData() {
              var searchTerm = $('#searchInput').val().toLowerCase();
              var filteredData = jsonData.filter(function (item) {
                var matchesCategory = (currentCategory === 'todos') || (item.categoria === currentCategory);
                var matchesSearch = item.Nombre.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
              });
              console.log("filteredData", filteredData);
              renderResults(filteredData);
            }

            // --- EVENTOS DEL BUSCADOR Y FILTROS ---
            $('#searchInput').on('keyup', function () { filterData(); });
            $('#searchBtn').on('click', function () { filterData(); });
            $('.filter-btn').on('click', function () {
              $('.filter-btn').removeClass('active');
              $(this).addClass('active');
              currentCategory = $(this).attr('data-filter');
              console.log(currentCategory);

              filterData();
            });

            // Búsqueda (Al escribir, reiniciamos a la página 1)
            $('#searchInput').on('keyup', function () {
              currentPage = 1;
              processData();
            });

            // Filtro por Categoría
            $('.filter-btn').on('click', function () {
              $('.filter-btn').removeClass('active');
              $(this).addClass('active');
              currentCategory = $(this).attr('data-filter');
              currentPage = 1; // Volver a la página 1 al cambiar categoría
              processData();
            });

            // Clic en la Paginación
            $('#paginationContainer').on('click', 'a', function (e) {
              e.preventDefault();
              var targetPage = $(this).attr('data-page');
              var totalPages = Math.ceil(filteredData.length / itemsPerPage);

              if (targetPage === 'prev' && currentPage > 1) {
                currentPage--;
              } else if (targetPage === 'next' && currentPage < totalPages) {
                currentPage++;
              } else if (targetPage !== 'prev' && targetPage !== 'next') {
                currentPage = parseInt(targetPage);
              }

              processData();
            });

            window.copiarUrl = async function(nombreArchivo) {

                const url = "https://educacionmediasuperior.sep.gob.mx/" + encodeURI(nombreArchivo);

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Material formativo - SEMS',
                            text: 'Consulta este material formativo.',
                            url: url
                        });
                    } catch (err) {
                        console.log('Compartir cancelado');
                    }
                } else {
                    navigator.clipboard.writeText(url);
                    alert("Tu navegador no soporta compartir. El enlace fue copiado al portapapeles.");
                }

            }

            // --- LÓGICA DEL MODAL ---

            // Usamos delegación de eventos porque los botones se generan dinámicamente
            $('#resultsContainer').on('click', '.btn-abrir-modal', function () {
              // Obtenemos los datos del botón que se hizo clic
              var url = $(this).data('url');
              var tipo = $(this).data('tipo');
              var titulo = $(this).data('titulo');

              // Actualizamos el título del modal
              $('#recursoModalLabel').text(titulo);

              var visor = $('#visorContenido');
              visor.empty(); // Limpiamos lo que hubiera antes

              // Inyectamos el HTML correcto según el tipo de archivo
              if (tipo === 'imagen') {
                visor.append('<img src="assets/mochila/Materialesdedifusion/' + url + '" class="img-responsive" style="margin: 0 auto; max-height: 70vh; border-radius: 10px;">');
              }
              else if (tipo === 'pdf') {
                // Usamos un iframe para embeber el PDF
                var contenidoModal = `<div class="row">
                  <div class="col-xs-12">
                    
                    <iframe src="${url}" width="100%" height="500px" style="border: none; border-radius: 10px;"></iframe>
                  </div>
                  <div class="col-xs-12 pt-20">
                    <div class="modal-botones" style="justify-content: center;" >
                                <a href="${url}" target="_blank" class="btn btn-descargar-m">
                                    Descargar <i class="glyphicon glyphicon-download-alt" style="margin-left:5px;"></i>
                                </a>
                                <button class="btn btn-compartir" onclick="copiarUrl('${url}')">
                                    Compartir <i class="glyphicon glyphicon-share" style="margin-left:5px;"></i>
                                </button>
                            </div>
                  </div>
                  </div>`;
                visor.append(contenidoModal);

                //visor.append('<iframe src="' + url + '" width="100%" height="500px" style="border: none; border-radius: 10px;"></iframe>');
              }
              else if (tipo === 'video') {
                // Usamos la etiqueta video nativa de HTML5
                visor.append('<video width="100%" controls autoplay style="border-radius: 10px; max-height: 70vh;"><source src="' + url + '" type="video/mp4">Tu navegador no soporta el tag de video.</video>');
              }
              else {
                visor.append('<p class="text-danger">Formato no soportado.</p>');
              }

              // Finalmente, mostramos el modal
              $('#recursoModal').modal('show');
            });

            // IMPORTANTE: Limpiar el modal al cerrarlo (evita que el video/audio siga sonando en el fondo)
            $('#recursoModal').on('hidden.bs.modal', function () {
              $('#visorContenido').empty();
            });

            // Inicializar
            updateCounts();
            processData();
          });

        </script>
        </body>
        
        </html>
