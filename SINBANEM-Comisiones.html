        <script>
          $(document).ready(function () {

           
            var jsonData = [
  {
    "id": "1",
    "titulo": "Comisión de Trabajo sobre Reglas y Lineamientos de Registro Escolar y Portabilidad de Estudios",
    "descripcion_corta": "Garantizar la permanencia en el sistema escolar de Educación Media Superior, la portabilidad de los estudios, la continuidad de las trayectorias escolares y prevenir la desafiliación",
    "objetivo": "",
    "archivo": "assets/SINBANEM/comisiones/comision.png",
    "estatus": "publico",
    "integrantes": "Presidenta del SINBANEM, Subsecretario de Educación Media Superior del Estado de México, Subsecretario de Educación Media Superior del Estado de Jalisco, Directora de Educación Media Superior y Superior en el Estado de Tlaxcala, Subsecretaria de Educación Media Superior y Superior del Estado de Guerrero, Subsecretario de Educación Media Superior y Superior del Estado de Hidalgo, Coordinadora de Educación Media Superior y Formación para el Trabajo en el Estado de Querétaro y Subsecretaria de Educación Ciencia, Tecnología e Innovación de la Ciudad de México. ",
    "ayo": "2025-2026"
  },
  {
    "id": "2",
    "titulo": "Comisión de Trabajo sobre Indicadores Educativos",
    "descripcion_corta": "Revisar los indicadores de Educación Media Superior",
    "objetivo": "",
    "archivo": "assets/SINBANEM/comisiones/comision.png",
    "estatus": "publico",
    "integrantes": "Presidente del SINBANEM, Subsecretaria de Educación Media Superior del Estado de Nuevo León, Subsecretario de Educación Media Superior del Estado de México, Subsecretario de Educación Media Superior del Estado de Jalisco y Subsecretario de Educación Media Superior del Estado de Oaxaca",
    "ayo": "2025-2026"
  }
];

             // Estado
  var currentCategory = 'todos';
              var currentPage = 1;
              var itemsPerPage = 6;
              var filteredData = [];

              function removeAccents(str) {
                  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
              }

              function escapeHtml(str) {
                  return String(str || "")
                      .replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
              }

              function countIntegrantes(integrantes) {
                  if (!integrantes) return 0;
                  return integrantes
                      .split(',')
                      .map(function (item) { return item.trim(); })
                      .filter(function (item) { return item.length > 0; })
                      .length;
              }

              function formatEstatus(estatus) {
                  if (!estatus) return 'Sin estatus';
                  var limpio = String(estatus).trim().toLowerCase();
                  return limpio.charAt(0).toUpperCase() + limpio.slice(1);
              }

              function updateCounts() {
                  $('#count-todos').text(jsonData.length);
                  $('#count-2025').text(jsonData.filter(item => Number(item.ayo) === 2025).length);
                  $('#count-2026').text(jsonData.filter(item => Number(item.ayo) === 2026).length);
              }

              function renderPagination(totalItems) {
                  var pagination = $('#paginationContainer');
                  pagination.empty();

                  var totalPages = Math.ceil(totalItems / itemsPerPage);

                  if (totalPages <= 1) return;

                  var prevClass = (currentPage === 1) ? 'disabled' : '';
                  pagination.append('<li class="' + prevClass + '"><a href="#" data-page="prev">&laquo;</a></li>');

                  for (var i = 1; i <= totalPages; i++) {
                      var activeClass = (currentPage === i) ? 'active' : '';
                      pagination.append('<li class="' + activeClass + '"><a href="#" data-page="' + i + '">' + i + '</a></li>');
                  }

                  var nextClass = (currentPage === totalPages) ? 'disabled' : '';
                  pagination.append('<li class="' + nextClass + '"><a href="#" data-page="next">&raquo;</a></li>');
              }

              function renderResults(data) {
                  var container = $('#resultsContainer');
                  container.empty();

                  if (data.length === 0) {
                      container.append('<div class="col-xs-12 text-center"><h4>No se encontraron comisiones.</h4></div>');
                      return;
                  }

                  $.each(data, function (index, item) {
                      var integrantesTotal = countIntegrantes(item.integrantes);

                      var html = `
        <div class="col-sm-6 col-md-4">
          <div class="comision-card">
            <div class="comision-icon-box">
              <img src="assets/SINBANEM/comisiones/comisionesIcon.png" alt="${escapeHtml(item.titulo)}">
            </div>

            <h4 class="comision-titulo">${escapeHtml(item.titulo)}</h4>

            <p class="comision-descripcion">${escapeHtml(item.descripcion_corta || '')}</p>

            <div class="comision-meta">
              <div class="comision-meta-item">
                <i class="glyphicon glyphicon-user"></i>
                <span>${integrantesTotal} integrante${integrantesTotal === 1 ? '' : 's'}</span>
              </div>

              <div class="comision-meta-item">
                <i class="glyphicon glyphicon-globe"></i>
                <span>${escapeHtml(formatEstatus(item.estatus))}</span>
              </div>

              <div class="comision-meta-item">
                <i class="glyphicon glyphicon-calendar"></i>
                <span>${escapeHtml(item.ayo)}</span>
              </div>
            </div>

            <button
              class="btn-ver-comision btn-abrir-item"
              data-id="${item.id}">
              Ver comisión
              <i class="glyphicon glyphicon-chevron-right" style="font-size: 10px; margin-left:6px;"></i>
            </button>
          </div>
        </div>
      `;

                      container.append(html);
                  });
              }

              function processData() {
                  var searchTerm = removeAccents($('#searchInput').val().toLowerCase().trim());

                  filteredData = jsonData.filter(function (item) {
                      var matchesCategory = (currentCategory === 'todos') || (String(item.ayo) === String(currentCategory));

                      var textoBusqueda = removeAccents(
                          (
                              (item.titulo || '') + ' ' +
                              (item.descripcion_corta || '') + ' ' +
                              (item.objetivo || '') + ' ' +
                              (item.integrantes || '') + ' ' +
                              (item.estatus || '') + ' ' +
                              (item.ayo || '')
                          ).toLowerCase()
                      );

                      var matchesSearch = textoBusqueda.includes(searchTerm);

                      return matchesCategory && matchesSearch;
                  });

                  // Más recientes primero: por el año más alto de "ayo" (p. ej. "2025-2026"),
                  // y a igualdad, el id mayor (registrado después) va antes
                  var latestYear = function (item) {
                      var years = String(item.ayo || '').match(/\d{4}/g) || [];
                      return years.length ? Math.max.apply(null, years.map(Number)) : 0;
                  };
                  filteredData.sort(function (a, b) {
                      return (latestYear(b) - latestYear(a)) || (Number(b.id) - Number(a.id));
                  });

                  var totalPages = Math.ceil(filteredData.length / itemsPerPage);
                  if (currentPage > totalPages) {
                      currentPage = totalPages || 1;
                  }

                  var startIndex = (currentPage - 1) * itemsPerPage;
                  var endIndex = startIndex + itemsPerPage;
                  var paginatedData = filteredData.slice(startIndex, endIndex);

                  renderResults(paginatedData);
                  renderPagination(filteredData.length);
              }

              $('#searchInput').on('keyup', function () {
                  currentPage = 1;
                  processData();
              });

              $('#searchBtn').on('click', function () {
                  currentPage = 1;
                  processData();
              });

              $('.filter-btn').on('click', function () {
                  $('.filter-btn').removeClass('active');
                  $(this).addClass('active');

                  currentCategory = $(this).data('filter');
                  currentPage = 1;
                  processData();
              });

              $('#paginationContainer').on('click', 'a', function (e) {
                  e.preventDefault();

                  var targetPage = $(this).data('page');
                  var totalPages = Math.ceil(filteredData.length / itemsPerPage);

                  if (targetPage === 'prev' && currentPage > 1) {
                      currentPage--;
                  } else if (targetPage === 'next' && currentPage < totalPages) {
                      currentPage++;
                  } else if (targetPage !== 'prev' && targetPage !== 'next') {
                      currentPage = parseInt(targetPage, 10);
                  }

                  processData();
              });

              $('#resultsContainer').on('click', '.btn-abrir-item', function () {
                  var itemId = $(this).data('id');
                  window.location.href = '/SINBANEM-ComisionDetalle.html?id=' + itemId;
              });

              updateCounts();
              processData();
          });


        </script>
        </body>
