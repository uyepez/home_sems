            function obtenerIdURL() {
              var params = new URLSearchParams(window.location.search);
              return params.get('id');
            }

            function buscarItemPorId(idBuscado) {
              return jsonData.find(function (item) {
                return String(item.id) === String(idBuscado);
              });
            }

            function normalizarRutaArchivo(valor) {
              if (!valor || !String(valor).trim()) return '';

              valor = String(valor).trim();

              if (/^https?:\/\//i.test(valor) || valor.charAt(0) === '/') {
                return valor;
              }

              return encodeURI(baseMateriales + valor);
            }

            function configurarBotonArchivo(selector, archivo) {
              var $btn = $(selector);
              var url = normalizarRutaArchivo(archivo);

              if (url) {
                $btn.attr('href', url).attr('target', '_blank').show();
              } else {
                $btn.attr('disabled', true).show();
              }
            }

            function iconoModalidad(modalidad) {
              var txt = String(modalidad || '').toLowerCase();

              if (txt.indexOf('virtual') !== -1) return 'glyphicon-headphones';
              if (txt.indexOf('presencial') !== -1) return 'glyphicon-user';
              return 'glyphicon-map-marker';
            }


            function obtenerYoutubeEmbed(url) {

  if (!url) return '';

  // youtube.com/watch?v=
  var match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);

  if (!match || !match[1]) {
    return '';
  }

  return 'https://www.youtube.com/embed/' + match[1];
}

function renderMediaSesion(item) {

  var container = $('#mediaSesion');
  container.empty();

  // Si existe video
  if (item.video && item.video.trim() !== '') {

    var embedUrl = obtenerYoutubeEmbed(item.video);

    if (embedUrl) {

      container.html(`
        <iframe
          src="${embedUrl}"
          title="${item.titulo || ''}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      `);

      return;
    }
  }

  // Si no hay video usar poster
  if (item.file_poster) {

    container.html(`
      <img
        src="${item.file_poster}"
        alt="${item.titulo || ''}"
        class="img-responsive">
    `);

  } else {

    container.html(`
      <div class="media-vacia">
        Sin imagen disponible
      </div>
    `);

  }
}


            function renderDetalle(item) {
              if (!item) {
                $('#titulo').text('Sesión no encontrada');
                $('#descripcion').text('No existe una sesión con el id solicitado.');
                $('#posterSesion').hide();
                $('#btnOrdenDia, #btnPresentacion, #btnActa, #btnMinuta, #btnCompartir').hide();
                return;
              }

              $('#titulo').text(item.titulo || 'Sin título');
              $('#descripcion').text(item.descripcion || item.descripcion_corta || 'Sin descripción');
              $('#fecha').text(item.fecha || '');
              $('#modalidad').text(item.modalidad || '');

              $('#iconModalidad')
                .removeClass('glyphicon-headphones glyphicon-user glyphicon-map-marker')
                .addClass(iconoModalidad(item.modalidad));

              /*if (item.file_poster) {
                $('#posterSesion').attr('src', item.file_poster).attr('alt', item.titulo || 'Sesión');
              } else {
                $('#posterSesion').hide();
              }*/
             renderMediaSesion(item);

              configurarBotonArchivo('#btnOrdenDia', item.file_ordenDia);
              configurarBotonArchivo('#btnPresentacion', item.file_presentacion);
              configurarBotonArchivo('#btnActa', item.file_acta);
              configurarBotonArchivo('#btnMinuta', item.file_minuta);

              $('#btnCompartir').off('click').on('click', function () {
                var shareData = {
                  title: item.titulo || 'Sesión',
                  text: item.descripcion_corta || item.descripcion || 'Te comparto esta sesión',
                  url: window.location.href
                };

                if (navigator.share) {
                  navigator.share(shareData).catch(function (error) {
                    console.log('Error al compartir:', error);
                  });
                } else {
                  navigator.clipboard.writeText(window.location.href).then(function () {
                    alert('Enlace copiado al portapapeles');
                  }).catch(function () {
                    prompt('Copia este enlace:', window.location.href);
                  });
                }
              });
            }

            function obtenerIdsRelacionados(relacionadosStr) {
              if (!relacionadosStr) return [];

              return String(relacionadosStr)
                .split(',')
                .map(function (id) { return id.trim(); })
                .filter(function (id) { return id !== ''; });
            }

            function renderRelacionados(itemActual) {
              var container = $('#relacionadosContainer');
              container.empty();

              if (!itemActual || !itemActual.relacionados) {
                container.html('<div class="col-xs-12 text-center">No hay relacionados.</div>');
                return;
              }

              var idsRelacionados = obtenerIdsRelacionados(itemActual.relacionados);

              var relacionados = idsRelacionados
                .map(function (idRel) {
                  return buscarItemPorId(idRel);
                })
                .filter(function (item) {
                  return item && String(item.id) !== String(itemActual.id);
                })
                .slice(0, 2);

              if (relacionados.length === 0) {
                container.html('<div class="col-xs-12 text-center">No hay relacionados para esta sesión.</div>');
                return;
              }

              $.each(relacionados, function (_, item) {
                var html = `
                  <div class="col-xs-12 col-md-6">
                    <div class="card-relacionado">
                      <div class="fecha-relacionado">
                        <span class="glyphicon glyphicon-calendar"></span>
                        ${item.fecha || ''}
                      </div>

                      <h3 class="titulo-card-rel">${item.titulo || ''}</h3>

                      <p class="desc-card-rel">${item.descripcion_corta || item.descripcion || ''}</p>

                      <div class="text-right">
                        <a href="SINBANEM-SesionesDetalle.html?id=${item.id}" class="btn btn-ver-rel">
                          Ver sesión <i class="glyphicon glyphicon-chevron-right" style="margin-left:5px;"></i>
                        </a>
                      </div>
                    </div>
                  </div>
                `;

                container.append(html);
              });
            }

            var id = obtenerIdURL();

            if (!id) {
              $('#titulo').text('Sesión no encontrada');
              $('#descripcion').text('No se recibió un identificador en la URL.');
              $('#posterSesion').hide();
              $('#btnOrdenDia, #btnPresentacion, #btnActa, #btnMinuta, #btnCompartir').hide();
              $('#relacionadosContainer').html('<div class="col-xs-12 text-center">No hay relacionados.</div>');
              return;
            }

            var itemActual = buscarItemPorId(id);

            renderDetalle(itemActual);
            renderRelacionados(itemActual);

          });

        </script>
