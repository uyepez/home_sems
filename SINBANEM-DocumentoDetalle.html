            /**********RELACIONADOS***********/
            function obtenerIdURL() {
              var params = new URLSearchParams(window.location.search);
              return params.get('id');
            }

            function buscarItemPorId(id) {
              return jsonData.find(function (item) {
                return String(item.id) === String(id);
              });
            }

            function formatearFecha(fechaStr) {
              if (!fechaStr) return '';

              var meses = [
                'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
                'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'
              ];

              var partes = fechaStr.split('-'); // yyyy-mm-dd
              if (partes.length !== 3) return fechaStr;

              var anio = partes[0];
              var mes = parseInt(partes[1], 10) - 1;
              var dia = parseInt(partes[2], 10);

              return dia + ' de ' + meses[mes] + ' de ' + anio;
            }

            function renderRelacionados(itemActual) {
              var container = $('#relacionadosContainer');
              container.empty();

              if (!itemActual || !itemActual.grupo) {
                container.html('<div class="col-xs-12 text-center">No hay relacionados.</div>');
                return;
              }

              var relacionados = jsonData.filter(function (item) {
                return item.grupo === itemActual.grupo && item.id !== itemActual.id;
              }).slice(0, 2);

              if (relacionados.length === 0) {
                container.html('<div class="col-xs-12 text-center">No hay relacionados para este recurso.</div>');
                return;
              }

              $.each(relacionados, function (_, item) {
                var fechaBonita = formatearFecha(item.fecha);

                var html = `
                  <div class="col-xs-12 col-md-6">
                    <div class="card-relacionado">
                      <div class="fecha-relacionado">${fechaBonita}</div>
                      <h3 class="titulo-card-rel">${item.titulo}</h3>
                      <p class="desc-card-rel">${item.descripcion_corta || item.descripcion || ''}</p>
                      <div class="text-right">
                        <a href="SINBANEM-DocumentoDetalle.html?id=${item.id}" class="btn btn-ver-rel">
                          Ver sesión <i class="glyphicon glyphicon-chevron-right" style="margin-left:5px;"></i>
                        </a>
                      </div>
                    </div>
                  </div>
                `;

                container.append(html);
              });
            }

            var id = obtenerIdURL();
            var itemActual = buscarItemPorId(id);

            renderRelacionados(itemActual);
